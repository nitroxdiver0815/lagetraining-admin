<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lagetraining – Verwaltung</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/light/main.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://js.arcgis.com/4.33/"></script>
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Virtuelles Lagetraining</p>
        <h1>Fahrzeug–Wachen-Zuordnung</h1>
      </div>
      <button id="signInButton" class="secondary" type="button">Bei ArcGIS anmelden</button>
    </header>

    <section class="card" aria-labelledby="assignmentHeading">
      <h2 id="assignmentHeading">Heimatwache festlegen</h2>
      <p class="hint">Ein Fahrzeug und die zugehörige Heimatwache auswählen.</p>

      <div class="form-grid">
        <label>
          Fahrzeug
          <select id="vehicleSelect" disabled>
            <option value="">Bitte anmelden</option>
          </select>
        </label>

        <label>
          Heimatwache
          <select id="locationSelect" disabled>
            <option value="">Bitte anmelden</option>
          </select>
        </label>
      </div>

      <div id="currentAssignment" class="current" hidden></div>

      <div class="actions">
        <button id="assignButton" type="button" disabled>Heimatwache zuordnen</button>
        <button id="reloadButton" class="secondary" type="button" disabled>Neu laden</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
