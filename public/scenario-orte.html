<!doctype html>
<html lang="de" data-tool="locations">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szenario – Orte</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/light/main.css">
  <link rel="stylesheet" href="scenario-tools.css">
  <script src="https://js.arcgis.com/4.33/"></script>
  <script src="config.js"></script>
  <script defer src="scenario-tools.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">Szenarioverwaltung</p><h1>Orte zuordnen</h1></div>
      <button id="signInButton" class="secondary" type="button">Bei ArcGIS anmelden</button>
    </header>

    <section class="card">
      <label>Szenario
        <select id="scenarioSelect" disabled><option>Bitte anmelden</option></select>
      </label>
    </section>

    <section class="card">
      <h2>Neue Ortszuordnung</h2>
      <div class="form-grid">
        <label>Ort
          <select id="locationSelect" disabled></select>
        </label>
        <label>Rolle
          <select id="locationRole">
            <option value="INCIDENT_SITE">Einsatzstelle</option>
            <option value="START">Startort</option>
            <option value="DESTINATION">Ziel</option>
            <option value="REFERENCE">Referenzort</option>
          </select>
        </label>
        <label>Anzeigereihenfolge
          <input id="displayOrder" type="number" min="0" step="1">
        </label>
        <label>Primärer Ort
          <select id="locationPrimary"><option value="0">Nein</option><option value="1">Ja</option></select>
        </label>
        <label class="wide">Hinweise
          <textarea id="locationNotes"></textarea>
        </label>
      </div>
      <div class="actions"><button id="saveButton" disabled>Ort zuordnen</button></div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="card">
      <h2>Zugeordnete Orte</h2>
      <div id="assignmentList" class="assignment-list"></div>
    </section>
  </main>
</body>
</html>
